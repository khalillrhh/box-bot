# MT5 Login Proof — Milestone 1 of the free MT5 execution arm.
#
# Manual trigger only (workflow_dispatch): nothing runs on a schedule
# and nothing runs on push. The job installs the MetaTrader 5 terminal,
# pre-launches it with a startup config so the terminal logs itself in
# (run #2 taught us a cold Python-driven start never gets IPC up:
# -10005 'IPC timeout'), waits for it to settle, then the script
# attaches and prints the account info, confirming a DEMO account.
# It never places an order.
#
# v4 adds an always-run DIAGNOSTICS step: run #3 failed with the same
# IPC timeout even against a warm terminal, so before any more blind
# fixes this run dumps the terminal process state and the terminal's
# own log files — the evidence that says why IPC never comes up.
#
# Lives in the repo at .github/workflows/exec.yml, with login_proof.py
# at repo root. The startup config (which contains the password) is
# generated on the runner in RUNNER_TEMP — never in the repo.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   MT5_LOGIN     e.g. 472776274
#   MT5_PASSWORD  trading password
#   MT5_SERVER    e.g. Exness-MT5Trial16

name: MT5 Login Proof

on:
  workflow_dispatch:

jobs:
  login-proof:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MetaTrader5 package
        run: pip install MetaTrader5

      - name: Install MetaTrader 5 terminal (official MetaQuotes installer)
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"
          $setup = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/auto" -Wait
          $term = "C:\Program Files\MetaTrader 5\terminal64.exe"
          if (Test-Path $term) { Write-Host "Terminal installed: $term" }
          else { Write-Error "terminal64.exe not found after install"; exit 1 }
          Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Pre-launch terminal with auto-login config and let it settle
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $cfg = "$env:RUNNER_TEMP\startup_login.ini"
          @"
          [Common]
          Login=$env:MT5_LOGIN
          Password=$env:MT5_PASSWORD
          Server=$env:MT5_SERVER
          KeepPrivate=1
          NewsEnable=0
          [StartUp]
          Symbol=XAUUSD
          Period=M15
          "@ | Set-Content -Path $cfg -Encoding ASCII
          $term = "C:\Program Files\MetaTrader 5\terminal64.exe"
          Start-Process -FilePath $term -ArgumentList "/config:$cfg"
          Write-Host "Terminal launched with auto-login config; settling 240s ..."
          Start-Sleep -Seconds 240
          Get-Process terminal64 -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, StartTime

      - name: Run login proof (no trading)
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python login_proof.py

      - name: Diagnostics — terminal process + its own logs (always runs)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== terminal64 process state ==="
          Get-Process terminal64 -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, StartTime, Responding
          Write-Host "=== terminal data folders ==="
          $base = "$env:APPDATA\MetaQuotes\Terminal"
          if (Test-Path $base) {
            Get-ChildItem $base -Directory | Select-Object FullName
            Write-Host "=== newest log files (tails) ==="
            $logs = Get-ChildItem $base -Recurse -Filter *.log -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 3
            foreach ($l in $logs) {
              Write-Host "--- $($l.FullName) (modified $($l.LastWriteTime)) ---"
              Get-Content $l.FullName -Tail 60 -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "No terminal data folder at $base"
          }
